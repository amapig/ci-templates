# 调用 PM2 部署模板
# 文件路径: .github/workflows/deploy.yml (在各项目仓库中)
#
# 使用方法:
# 1. 复制本文件到项目仓库的 .github/workflows/deploy.yml
# 2. 修改 inputs 中的项目配置
# 3. 在 GitHub 仓库 Settings > Secrets 中添加 SERVER_SSH_KEY
#    (GH_TOKEN 是 GitHub 自动提供的，不需要手动添加)
# 4. 其他 Secrets (DATABASE_URL 等) 在 env_vars 中通过 ${{ secrets.XXX }} 引用

name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: amapig/ci-templates/.github/workflows/deploy-pm2.yml@main
    with:
      # ===== 项目基本信息 =====
      project_name: jiankaopaike
      repo_name: jiankaopaike
      deploy_path: /root/jiankao/jiankaopaike
      pm2_process: jiankaopaike

      # ===== 部署选项 =====
      branch: ${{ github.ref_name }}
      # pm2_mode: restart          # restart=快速重启 | delete-recreate=重建进程(重载环境变量)
      # build_cmd: npm run build   # 自定义构建命令
      # prisma_generate: true      # 是否运行 prisma generate
      # prisma_migrate: true       # 是否运行 prisma db push

      # ===== 环境变量 =====
      # 所有项目特有的环境变量都写在这里，每行一个 KEY=VALUE
      # 敏感值通过 secrets 引用 (需要先在 GitHub 仓库 Settings > Secrets 中添加)
      env_vars: |
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
        NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
        AUTH_SECRET=${{ secrets.AUTH_SECRET }}

    secrets:
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

